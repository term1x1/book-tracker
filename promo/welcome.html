<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./fonts.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Холст 640×400 → при DPR 2 получается 1280×800: картинка для приветствия бота */
  body {
    width: 640px; height: 400px; overflow: hidden;
    background: #0d1a2c; color: #e8f1fc;
    font-family: 'Inter', -apple-system, sans-serif;
    position: relative;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(70px); }
  .g1 { width: 360px; height: 360px; background: rgba(43,125,233,.34); top: -150px; left: -90px; }
  .g2 { width: 320px; height: 320px; background: rgba(79,156,240,.2); bottom: -170px; right: -80px; }

  .wrap { position: relative; height: 100%; padding: 22px 26px 0; }

  .head { display: flex; align-items: baseline; gap: 10px; }
  .brand {
    display: flex; align-items: center; gap: 1px;
    font-family: 'Unbounded', -apple-system, sans-serif;
    font-weight: 600; font-size: 17px; letter-spacing: 1.6px;
  }
  .brand svg { width: 18px; height: 18px; margin: 0 2px; transform: translateY(1px); }
  .tagline { font-size: 13.5px; color: #9db4d2; }

  .row { display: flex; gap: 22px; justify-content: center; margin-top: 16px; }
  .col { width: 168px; text-align: center; }

  .phone {
    width: 168px; height: 268px;
    border-radius: 22px; padding: 5px;
    background: linear-gradient(160deg, #3b4f6b, #1a2740);
    box-shadow: 0 14px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.07);
  }
  .screen { width: 100%; height: 100%; border-radius: 18px; overflow: hidden; }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }

  .cap { margin-top: 11px; font-size: 13px; font-weight: 700; }
  .cap span { display: block; font-size: 11.5px; font-weight: 500; color: #8ba4c4; margin-top: 2px; }
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="wrap">
    <div class="head">
      <div class="brand">
        I
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 20.8C11.6 20.8 7.5 18 5.4 15.6 3.6 13.6 2.9 11.7 3.4 9.8c.5-1.9 2-3.2 3.9-3.3 1.8-.1 3.5.8 4.7 2.4 1.2-1.6 2.9-2.5 4.7-2.4 1.9.1 3.4 1.4 3.9 3.3.5 1.9-.2 3.8-2 5.8-2.1 2.4-6.2 5.2-6.6 5.2Z" fill="#2b7de9"/>
          <path d="M6.6 11.2c1.9 0 3.7.6 5.4 1.9 1.7-1.3 3.5-1.9 5.4-1.9" stroke="#0d1a2c" stroke-width="1.4" stroke-linecap="round" fill="none"/>
          <path d="M12 13.1v7" stroke="#0d1a2c" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        MB
      </div>
      <div class="tagline">книжная полка прямо в Telegram</div>
    </div>

    <div class="row">
      <div class="col">
        <div class="phone"><div class="screen"><img src="./shot-library.jpg" alt="" /></div></div>
        <div class="cap">Твоя полка<span>обложки и прогресс</span></div>
      </div>
      <div class="col">
        <div class="phone"><div class="screen"><img src="./shot-readers.jpg" alt="" /></div></div>
        <div class="cap">Друзья и рейтинг<span>кто что читает</span></div>
      </div>
      <div class="col">
        <div class="phone"><div class="screen"><img src="./shot-profile.jpg" alt="" /></div></div>
        <div class="cap">Очки и звания<span>календарь чтения</span></div>
      </div>
    </div>
  </div>
</body>
</html>
